{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — MIICiQ Internal Knowledge Assistant</title>
  <link rel="stylesheet" href="{% static 'assistant/css/styles.css' %}">
</head>
<body class="login-page" style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; overflow:auto;">
  <main class="login-card" role="main" style="width:min(100%, 420px); max-width:420px; margin:0 auto; padding:2.25rem 2rem; border:1px solid var(--border-medium); border-radius:var(--radius-lg); background:var(--bg-card); background-image:var(--gradient-card); box-shadow:var(--shadow-lg);">
    <div class="login-brand" style="display:flex; flex-direction:column; align-items:center; gap:0.35rem; margin-bottom:1.75rem; text-align:center;">
      <div class="brand-logo login-logo">IQ</div>
      <div class="brand-title">MIICiQ</div>
      <div class="brand-tag">Internal AI</div>
    </div>

    <h1 class="login-title" style="font-size:1.35rem; font-weight:700; text-align:center; letter-spacing:-0.02em;">Sign in to continue</h1>
    <p class="login-subtitle" style="margin:0.4rem 0 1.5rem; font-size:0.85rem; color:var(--text-muted); text-align:center;">
      Use your company account to access the internal knowledge assistant.
    </p>

    {% if error %}
      <div class="login-error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'assistant:login' %}" class="login-form" autocomplete="on" style="display:flex; flex-direction:column; gap:1rem;">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="form-group">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" name="username" class="form-control" required autofocus autocomplete="username" placeholder="e.g. jdoe">
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" class="form-control" required autocomplete="current-password" placeholder="••••••••">
      </div>

      <button type="submit" class="btn-new-chat login-submit">Sign In</button>
    </form>

    <p class="login-note" style="margin-top:1.5rem; font-size:0.75rem; color:var(--text-muted); text-align:center;">
      Administrators manage documents and users via
      <a href="/django-admin/">Django admin</a>.
    </p>
  </main>
</body>
</html>
