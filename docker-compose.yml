version: '3.8'

services:
  # --------------------------------------------------------------------------
  # Local LLM Server (Ollama)
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: miiciq_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0:11434
    # GPU Acceleration configuration (NVIDIA GPU on Linux/Windows host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # --------------------------------------------------------------------------
  # MIICiQ Django Web Application
  # --------------------------------------------------------------------------
  web:
    build: .
    container_name: miiciq_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - DEBUG=0
      # REQUIRED: set in a .env file next to docker-compose.yml (e.g. SECRET_KEY=$(python -c "import secrets;print(secrets.token_urlsafe(50))"))
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,intranet.company.local}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost}
      - HTTPS_ONLY=${HTTPS_ONLY:-0}
      # Origins allowed to embed the widget iframe, e.g. https://crm.company.local
      - EMBED_ALLOWED_ORIGINS=${EMBED_ALLOWED_ORIGINS:-}
      - SQLITE_PATH=/app/db_volume/db.sqlite3
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b-instruct}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # 'hash' (offline default) or 'ollama' (neural; run: ollama pull nomic-embed-text, then rebuild_index)
      - RAG_EMBEDDING_BACKEND=${RAG_EMBEDDING_BACKEND:-hash}
      - RAG_TOP_K=4
      # Demo accounts are only created when SEED_DEMO_USERS=1. Set DEMO_*_PASSWORD or random ones are printed to the log.
      - SEED_DEMO_USERS=${SEED_DEMO_USERS:-0}
    volumes:
      - db_data:/app/db_volume
      - media_data:/app/media
      - chroma_data:/app/chroma_db
      - static_data:/app/staticfiles
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             ( [ \"$$SEED_DEMO_USERS\" = \"1\" ] && python manage.py ingest_samples || true ) &&
             python manage.py seed_ph_knowledge &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --timeout 180"

  # --------------------------------------------------------------------------
  # Nginx Reverse Proxy (Iframe Intranet Compatible + SSE Buffering Disabled)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: miiciq_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  ollama_models:
  db_data:
  media_data:
  chroma_data:
  static_data:
