version: '3.8'

services:
  # --------------------------------------------------------------------------
  # Local LLM Server (Ollama)
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: miiciq_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0:11434
    # GPU Acceleration configuration (NVIDIA GPU on Linux/Windows host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # --------------------------------------------------------------------------
  # MIICiQ Django Web Application
  # --------------------------------------------------------------------------
  web:
    build: .
    container_name: miiciq_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - DEBUG=0
      - SECRET_KEY=django-enterprise-prod-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,intranet.company.local,0.0.0.0
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b-instruct
      - RAG_TOP_K=5
      - RAG_CHUNK_SIZE=800
      - RAG_CHUNK_OVERLAP=100
    volumes:
      - db_data:/app/db_volume
      - media_data:/app/media
      - chroma_data:/app/chroma_db
    command: >
      sh -c "python manage.py migrate &&
             python manage.py ingest_samples &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  # --------------------------------------------------------------------------
  # Nginx Reverse Proxy (Iframe Intranet Compatible + SSE Buffering Disabled)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: miiciq_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  ollama_models:
  db_data:
  media_data:
  chroma_data:
